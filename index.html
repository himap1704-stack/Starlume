<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/IkonStarlume.png" />
  <title>Starlume · Music, Movie, Novel & Anime Experience</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0a0a0f 0%, #14141e 40%, #0f0f1a 100%);
      color: #FFFFFF;
      padding-bottom: 2rem;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(255, 215, 0, 0.03) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 80%, rgba(255, 215, 0, 0.02) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #14141e;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #FFD700, #F5A623);
      border-radius: 10px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem;
      position: relative;
      z-index: 1;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-bottom: 2.5rem;
      background: rgba(20, 20, 30, 0.6);
      backdrop-filter: blur(30px) saturate(1.2);
      -webkit-backdrop-filter: blur(30px) saturate(1.2);
      padding: 0.6rem 1.8rem;
      border-radius: 100px;
      border: 1px solid rgba(255, 215, 0, 0.08);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .logo {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .logo-icon {
      font-size: 1.8rem;
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.3));
      animation: starPulse 3s ease-in-out infinite;
    }

    @keyframes starPulse {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.1) rotate(5deg); opacity: 0.9; }
    }

    .logo-text {
      font-size: 1.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #FFD700, #F5A623, #FFD700);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 2px;
      text-shadow: 0 0 40px rgba(255, 215, 0, 0.1);
    }

    .nav-links {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
      position: relative;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 0.5rem 1.4rem;
      border-radius: 40px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(4px);
    }

    .nav-btn.active, .nav-btn:hover {
      background: linear-gradient(135deg, #FFD700, #F5A623);
      color: #0a0a0f;
      box-shadow: 0 4px 25px rgba(255, 215, 0, 0.35);
      border-color: transparent;
      transform: translateY(-2px);
    }

    .nav-btn .badge-count {
      background: rgba(255, 215, 0, 0.2);
      padding: 0 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      color: #FFD700;
      margin-left: 4px;
    }

    .nav-btn.active .badge-count {
      background: rgba(0, 0, 0, 0.2);
      color: #0a0a0f;
    }

    .user-btn {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 215, 0, 0.05));
      border: 1px solid rgba(255, 215, 0, 0.15);
      padding: 0.4rem 1.2rem 0.4rem 0.8rem;
      border-radius: 40px;
      color: #FFD700;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(4px);
    }

    .user-btn:hover {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.25), rgba(255, 215, 0, 0.1));
      transform: scale(1.02);
    }

    .user-btn .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FFD700, #F5A623);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: #0a0a0f;
      font-weight: 700;
    }

    .user-btn .user-name {
      max-width: 80px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .login-btn {
      background: linear-gradient(135deg, #FFD700, #F5A623);
      border: none;
      padding: 0.5rem 1.6rem;
      border-radius: 40px;
      color: #0a0a0f;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .login-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 25px rgba(255, 215, 0, 0.35);
    }

    .hero {
      position: relative;
      background: url('icons/20.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: 4rem 2rem;
      border-radius: 2rem;
      margin-bottom: 2.5rem;
      text-align: center;
      overflow: hidden;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 215, 0, 0.08);
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      z-index: 0;
      transition: background 0.5s ease;
    }

    .hero:hover::before {
      background: rgba(0, 0, 0, 0.4);
    }

    .hero .star-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, rgba(255,215,0,0.3), transparent),
        radial-gradient(2px 2px at 40px 70px, rgba(255,215,0,0.2), transparent),
        radial-gradient(2px 2px at 50px 160px, rgba(255,215,0,0.4), transparent),
        radial-gradient(2px 2px at 90px 40px, rgba(255,215,0,0.2), transparent),
        radial-gradient(2px 2px at 130px 80px, rgba(255,215,0,0.3), transparent),
        radial-gradient(2px 2px at 160px 30px, rgba(255,215,0,0.2), transparent),
        radial-gradient(1px 1px at 200px 120px, rgba(255,215,0,0.4), transparent),
        radial-gradient(2px 2px at 250px 50px, rgba(255,215,0,0.2), transparent),
        radial-gradient(1px 1px at 300px 90px, rgba(255,215,0,0.3), transparent),
        radial-gradient(2px 2px at 350px 40px, rgba(255,215,0,0.2), transparent);
      background-size: 400px 200px;
      animation: starTwinkle 4s ease-in-out infinite alternate;
      z-index: 0;
      opacity: 0.6;
      pointer-events: none;
    }

    @keyframes starTwinkle {
      0% { opacity: 0.3; }
      100% { opacity: 0.8; }
    }

    .hero h2, .hero p, .hero .hero-emoji {
      position: relative;
      z-index: 1;
    }

    .hero h2 {
      font-size: 3rem;
      margin-bottom: 0.8rem;
      background: linear-gradient(135deg, #FFD700, #F5A623, #FFD700, #FFFFFF);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 900;
      letter-spacing: 2px;
      animation: textShine 4s ease-in-out infinite;
      text-shadow: 0 0 60px rgba(255, 215, 0, 0.1);
    }

    @keyframes textShine {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .hero p {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.1rem;
      background: rgba(0, 0, 0, 0.4);
      display: inline-block;
      padding: 0.5rem 2rem;
      border-radius: 60px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.1);
      font-weight: 400;
    }

    .hero .hero-emoji {
      font-size: 3rem;
      display: block;
      margin-bottom: 0.5rem;
      animation: floatEmoji 3s ease-in-out infinite;
      filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.2));
    }

    @keyframes floatEmoji {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-10px) scale(1.05); }
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 0.6rem 1.5rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 215, 0, 0.1);
      transform: translateY(-2px);
    }

    .stat-number {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #FFD700, #F5A623);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .stat-label {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
    }

    .stat-icon {
      font-size: 1rem;
    }

    /* Mood Grid - Improved */
    .mood-section {
      margin-bottom: 2.5rem;
    }

    .section-title {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #FFFFFF, #FFD700);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 0.5px;
    }

    .mood-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      max-width: 800px;
      margin: 0 auto;
      padding: 1rem;
    }

    .mood-btn {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 1.2rem 1rem;
      border-radius: 1.2rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      color: rgba(255, 255, 255, 0.6);
      position: relative;
      overflow: hidden;
      min-height: 100px;
      text-align: center;
    }

    .mood-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 215, 0, 0.1);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .mood-btn:hover::before {
      width: 400px;
      height: 400px;
    }

    .mood-btn:hover {
      transform: translateY(-5px) scale(1.02);
      border-color: rgba(255, 215, 0, 0.15);
      background: rgba(255, 215, 0, 0.05);
    }

    .mood-btn.active {
      background: linear-gradient(135deg, #FFD700, #F5A623);
      color: #0a0a0f;
      transform: translateY(-5px) scale(1.05);
      border-color: transparent;
      box-shadow: 0 8px 40px rgba(255, 215, 0, 0.3);
    }

    .mood-btn .mood-emoji {
      font-size: 2.2rem;
      line-height: 1;
    }

    .mood-btn .mood-label {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .tab-container {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 0.6rem 1.8rem;
      border-radius: 40px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #FFD700, #F5A623);
      color: #0a0a0f;
      border-color: transparent;
      box-shadow: 0 4px 25px rgba(255, 215, 0, 0.25);
    }

    .tab-btn:hover {
      transform: translateY(-2px);
    }

    .genre-filter {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .genre-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 0.5rem 1.5rem;
      border-radius: 40px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.85rem;
    }

    .genre-btn.active {
      background: rgba(255, 215, 0, 0.15);
      color: #FFD700;
      border-color: rgba(255, 215, 0, 0.2);
    }

    .genre-btn:hover {
      transform: translateY(-2px);
      color: white;
    }

    .results-container {
      margin-top: 1rem;
      animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    .music-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 1.5rem;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .music-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #FFD700, #F5A623, transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .music-card:hover::before {
      opacity: 1;
    }

    .music-card:hover {
      transform: translateY(-8px);
      border-color: rgba(255, 215, 0, 0.15);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 215, 0, 0.03);
    }

    .card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      background: linear-gradient(135deg, #1a1a2e, #16213e);
    }

    .music-card:hover .card-img {
      transform: scale(1.04);
    }

    .card-img-placeholder {
      width: 100%;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      font-size: 3rem;
      color: rgba(255, 215, 0, 0.3);
    }

    .card-body {
      padding: 1.3rem 1.5rem 1.5rem;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .card-title .title-icon {
      margin-right: 6px;
    }

    .artist-name {
      font-size: 0.8rem;
      color: rgba(255, 215, 0, 0.7);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .action-icons {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .fav-icon, .journal-icon, .play-icon, .watch-icon, .read-icon {
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.25s ease;
    }

    .fav-icon:hover, .journal-icon:hover, .play-icon:hover, .watch-icon:hover, .read-icon:hover {
      transform: scale(1.2);
    }

    .fav-icon.active {
      color: #FFD700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      animation: starPop 0.4s ease;
    }

    @keyframes starPop {
      0% { transform: scale(1); }
      30% { transform: scale(1.4); }
      100% { transform: scale(1); }
    }

    .music-quote {
      background: rgba(255, 215, 0, 0.04);
      padding: 0.7rem 1rem;
      border-radius: 12px;
      margin: 10px 0;
      font-size: 0.78rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.6);
      border-left: 2px solid rgba(255, 215, 0, 0.2);
      font-style: italic;
    }

    .track-links {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .track-links a {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.04);
      padding: 7px 16px;
      border-radius: 40px;
      transition: all 0.25s ease;
      border: 1px solid rgba(255, 255, 255, 0.04);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      justify-content: center;
    }

    .track-links a:hover {
      background: linear-gradient(135deg, #FFD700, #F5A623);
      color: #0a0a0f;
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(255, 215, 0, 0.25);
    }

    .btn-play-now {
      background: linear-gradient(135deg, rgba(76, 175, 80, 0.15), rgba(76, 175, 80, 0.05)) !important;
      border-color: rgba(76, 175, 80, 0.2) !important;
      color: #66bb6a !important;
    }

    .btn-play-now:hover {
      background: linear-gradient(135deg, #4CAF50, #45a049) !important;
      color: white !important;
      border-color: transparent !important;
      box-shadow: 0 4px 25px rgba(76, 175, 80, 0.35) !important;
    }

    .btn-download-file {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 215, 0, 0.05)) !important;
      border-color: rgba(255, 215, 0, 0.2) !important;
      color: #FFD700 !important;
      padding: 6px 16px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: 0.2s;
    }

    .btn-download-file:hover {
      background: linear-gradient(135deg, #FFD700, #F5A623) !important;
      color: #0a0a0f !important;
      border-color: transparent !important;
      box-shadow: 0 4px 25px rgba(255, 215, 0, 0.35) !important;
    }

    .btn-buy-access {
      background: linear-gradient(135deg, rgba(255, 100, 100, 0.15), rgba(255, 100, 100, 0.05)) !important;
      border-color: rgba(255, 100, 100, 0.2) !important;
      color: #ff6b6b !important;
      padding: 6px 16px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: 0.2s;
    }

    .btn-buy-access:hover {
      background: linear-gradient(135deg, #ff6b6b, #e55a5a) !important;
      color: white !important;
      border-color: transparent !important;
      box-shadow: 0 4px 25px rgba(255, 100, 100, 0.35) !important;
    }

    .btn-unlocked {
      background: linear-gradient(135deg, rgba(76, 175, 80, 0.15), rgba(76, 175, 80, 0.05)) !important;
      border-color: rgba(76, 175, 80, 0.2) !important;
      color: #66bb6a !important;
      cursor: default !important;
    }

    .locked-badge {
      display: inline-block;
      background: rgba(255, 80, 80, 0.15);
      color: #ff6b6b;
      font-size: 0.6rem;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 600;
      margin-left: 8px;
      border: 1px solid rgba(255, 80, 80, 0.15);
    }

    .price-badge {
      display: inline-block;
      background: rgba(255, 215, 0, 0.1);
      color: #FFD700;
      font-size: 0.7rem;
      padding: 2px 12px;
      border-radius: 12px;
      font-weight: 700;
      margin-left: 8px;
      border: 1px solid rgba(255, 215, 0, 0.1);
    }

    .uploaded-badge {
      display: inline-block;
      background: rgba(255, 215, 0, 0.1);
      color: #FFD700;
      font-size: 0.6rem;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 600;
      margin-left: 8px;
      border: 1px solid rgba(255, 215, 0, 0.1);
    }

    .player-wrapper {

  }

  function saveUsers(users) {
    localStorage.setItem('starlume_users', JSON.stringify(users));
  }

  function saveUserSession(user) {
    currentUser = user;
    localStorage.setItem('starlume_user', JSON.stringify(user));
  }

  function logoutUser() {
    currentUser = null;
    localStorage.removeItem('starlume_user');

    showNotif('👋 Anda telah logout');
  }

  function openAuthModal(mode = 'login') {
    isLoginMode = mode === 'login';
    const modal = document.getElementById('authModal');
    const title = document.getElementById('authTitle');
    const subtitle = document.getElementById('authSubtitle');
    const emoji = document.getElementById('authEmoji');
    const submitBtn = document.getElementById('authSubmitBtn');
    const switchLink = document.getElementById('authSwitchLink');
    const errorEl = document.getElementById('authError');
    
    errorEl.classList.remove('show');
    
    if (isLoginMode) {
      title.textContent = 'Selamat Datang';
      subtitle.textContent = 'Masuk ke akun Starlume Anda';
      emoji.textContent = '✨';
      submitBtn.textContent = 'Masuk';
      switchLink.textContent = 'Daftar';
      document.getElementById('authSwitch').innerHTML = 'Belum punya akun? <span id="authSwitchLink">Daftar</span>';
      document.getElementById('authSwitchLink').addEventListener('click', () => openAuthModal('register'));
    } else {
      title.textContent = 'Buat Akun';

    document.getElementById('authPassword').value = '';

    document.body.style.overflow = 'hidden';
  }

  function closeAuthModal() {
    document.getElementById('authModal').classList.remove('active');
    document.body.style.overflow = '';
  }

  function handleAuth() {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value.trim();
    const errorEl = document.getElementById('authError');
    
    if (!email || !password) {
      errorEl.textContent = 'Email dan password harus diisi';
      errorEl.classList.add('show');
      return;
    }
    
    const users = getUsers();
    
    if (isLoginMode) {
      if (users[email] && users[email].password === password) {
        saveUserSession({ email: email, name: users[email].name || email.split('@')[0] });
        closeAuthModal();
        render();
        showNotif(`👋 Selamat datang kembali, ${users[email].name || email.split('@')[0]}!`);
      } else {
        errorEl.textContent = 'Email atau password salah';
        errorEl.classList.add('show');
      }
    } else {
      if (users[email]) {
        errorEl.textContent = 'Email sudah terdaftar';
        errorEl.classList.add('show');
        return;
      }
      if (password.length < 6) {
        errorEl.textContent = 'Password minimal 6 karakter';
        errorEl.classList.add('show');
        return;
      }
      
      const name = email.split('@')[0];
      users[email] = { password: password, name: name };
      saveUsers(users);
      saveUserSession({ email: email, name: name });
      closeAuthModal();
      render();
      showNotif(`🎉 Selamat bergabung, ${name}!`);
    }

  // ---------- PLAYER ----------
  function togglePlayer(songId) {
    const song = allSongs.find(s => s.id === songId);
    if(!song || !song.youtubeId) {
      showNotif('🎵 Video tidak tersedia untuk lagu ini');
      return;
    }

    document.querySelectorAll('.player-wrapper.active').forEach(el => {
      if(el.dataset.songId !== songId) {
        el.classList.remove('active');
        const iframe = el.querySelector('iframe');
        if(iframe) {
          iframe.src = iframe.src;
        }
      }
    });

    const player = document.querySelector(`.player-wrapper[data-song-id="${songId}"]`);
    if(player) {
      const isActive = player.classList.contains('active');
      const iframe = player.querySelector('iframe');
      
      if(isActive) {
        player.classList.remove('active');
        if(iframe) {
          iframe.src = `https://www.youtube.com/embed/${song.youtubeId}?enablejsapi=1&rel=0&modestbranding=1`;
        }
        showNotif('⏹️ Player ditutup');
      } else {
        player.classList.add('active');
        if(iframe) {
          iframe.src = `https://www.youtube.com/embed/${song.youtubeId}?autoplay=1&enablejsapi=1&rel=0&modestbranding=1`;
        }
        showNotif(`▶️ Memutar: ${song.title}`);
      }
    }
  }

  function openJournalModal(songId) {

        </div>
      </div>
    `;
    document.body.appendChild(modal);

    modal.querySelector("#cancelJournalBtn").onclick = closeModal;

      const newNote = textarea.value.trim();
      if(newNote === "") {
        if(songJournal[songId]) delete songJournal[songId];
        showNotif("📓 Catatan dihapus.");
      } else {
        songJournal[songId] = newNote;
        showNotif("📓 Catatan tersimpan! ✨");
      }
      saveJournal();
      closeModal();
      render();
    };
    modal.querySelector("#deleteJournalBtn").onclick = () => {
      if(songJournal[songId]) delete songJournal[songId];
      saveJournal();
      showNotif("🗑 Catatan jurnal dihapus.");
      closeModal();
      render();
    };
    modal.addEventListener("click", (e) => { if(e.target === modal) closeModal(); });

  // ---------- DOWNLOAD HANDLER ----------
  function downloadFile(fileData, fileName) {
    try {
      if (fileData.startsWith('data:')) {
        const response = fetch(fileData);
        response.then(res => res.blob()).then(blob => {
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showNotif(`📥 Mengunduh: ${fileName}`);
        }).catch(() => {
          showNotif('❌ Gagal mengunduh file');
        });
      } else {
        window.open(fileData, '_blank');
        showNotif(`📥 Membuka: ${fileName}`);
      }
    } catch (e) {
      showNotif('❌ Gagal mengunduh file');
      console.error(e);
    }
  }

  // ---------- UPLOAD HANDLER ----------
  let uploadFileData = null;
  let uploadFileName = '';

  function handleFileUpload(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = function(e) {
        resolve({
          name: file.name,
          size: file.size,
          type: file.type,
          data: e.target.result
        });
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function processUpload(category, formData) {
    if (!currentUser) {
      showNotif('🔒 Login dulu untuk mengupload!');
      openAuthModal('login');
      return;
    }

    const title = formData.get('title')?.trim();
    if (!title) {
      showNotif('⚠️ Judul harus diisi!');
      return;
    }

    const uploaded = getUploadedData();
    const file = uploadFileData;
    const fileType = uploadFileName.split('.').pop().toLowerCase();
    const hasPrice = formData.get('hasPrice') === 'on';
    const price = parseInt(formData.get('price')) || 0;
    
    let fileUrl = '';
    let fileIcon = '📄';
    if (file) {
      fileUrl = file.data;
      if (fileType.match(/mp4|webm|ogg|mov/)) fileIcon = '🎬';
      else if (fileType.match(/mp3|wav|flac|aac|ogg/)) fileIcon = '🎵';
      else if (fileType.match(/pdf|epub|mobi/)) fileIcon = '📚';
      else if (fileType.match(/jpg|jpeg|png|gif|webp/)) fileIcon = '🖼️';
    }

    const newItem = {
      id: `upload_${category}_${Date.now()}`,
      title: title,
      uploadedBy: currentUser.email,
      uploadedAt: new Date().toISOString(),
      fileUrl: fileUrl,
      fileName: uploadFileName,
      fileType: fileType,
      fileIcon: fileIcon,
      hasPrice: hasPrice,
      price: hasPrice ? price : 0,
      isLocked: hasPrice,
      img: file && fileType.match(/jpg|jpeg|png|gif|webp/) ? file.data : getIconImage(Date.now() + Math.random() * 1000)
    };

    if (category === 'music') {
      const mood = formData.get('mood') || 'relax';
      const artist = formData.get('artist') || 'Uploader';
      newItem.artist = artist;
      newItem.mood = mood;
      newItem.quote = formData.get('quote') || '✨ Karya yang diupload oleh pengguna';
      newItem.youtube = formData.get('youtube') || `https://www.youtube.com/results?search_query=${encodeURIComponent(title)}`;
      newItem.spotify = formData.get('spotify') || `https://open.spotify.com/search/${encodeURIComponent(title)}`;
      newItem.youtubeId = getYoutubeId(title) || null;
      newItem.type = 'music';
      uploaded.songs.push(newItem);
      showNotif('🎵 Lagu berhasil diupload!');
    } else if (category === 'movies') {
      const genre = formData.get('genre') || 'Aksi';
      const origin = formData.get('origin') || 'Upload';
      const year = parseInt(formData.get('year')) || new Date().getFullYear();
      const director = formData.get('director') || 'Uploader';
      newItem.genre = genre;
      newItem.origin = origin;
      newItem.year = year;
      newItem.director = director;
      newItem.rating = formData.get('rating') || '4.0';
      newItem.imdb = formData.get('imdb') || `https://www.imdb.com/find?q=${encodeURIComponent(title)}`;
      newItem.youtube = formData.get('trailer') || `https://www.youtube.com/results?search_query=${encodeURIComponent(title + " trailer")}`;
      newItem.description = formData.get('description') || `Film ${genre} yang diupload oleh pengguna.`;
      newItem.type = 'movie';

      newItem.type = 'anime';

  // ---------- DELETE UPLOAD ----------
  function deleteUpload(itemId, category) {
    if (!currentUser) {
      showNotif('🔒 Login dulu untuk menghapus!');
      return;
    }
    const uploaded = getUploadedData();
    let found = false;
    
    if (category === 'music') {
      const index = uploaded.songs.findIndex(s => s.id === itemId);
      if (index > -1) {
        uploaded.songs.splice(index, 1);
        found = true;
      }
    } else if (category === 'movie') {
      const index = uploaded.movies.findIndex(m => m.id === itemId);
      if (index > -1) {
        uploaded.movies.splice(index, 1);
        found = true;
      }
    } else if (category === 'novel') {
      const index = uploaded.novels.findIndex(n => n.id === itemId);
      if (index > -1) {
        uploaded.novels.splice(index, 1);
        found = true;
      }
    } else if (category === 'anime') {
      const index = uploaded.anime.findIndex(a => a.id === itemId);
      if (index > -1) {
        uploaded.anime.splice(index, 1);
        found = true;
      }
    }
    
    if (found) {
      saveUploadedData(uploaded);
      refreshAllData();
      showNotif('🗑 Item berhasil dihapus!');
      render();
    } else {
      showNotif('❌ Item tidak ditemukan');
    }
  }

  // ---------- TOGGLE PRICE ----------
  function togglePrice(itemId, category) {
    if (!currentUser) {
      showNotif('🔒 Login dulu untuk mengubah!');
      return;
    }
    const uploaded = getUploadedData();
    let items = [];
    
    if (category === 'music') items = uploaded.songs;
    else if (category === 'movie') items = uploaded.movies;
    else if (category === 'novel') items = uploaded.novels;
    else if (category === 'anime') items = uploaded.anime;
    
    const item = items.find(i => i.id === itemId);
    if (item) {
      item.hasPrice = !item.hasPrice;
      if (!item.hasPrice) {
        item.price = 0;
        item.isLocked = false;
      } else {
        item.price = item.price || 10000;
        item.isLocked = true;
      }
      saveUploadedData(uploaded);
      refreshAllData();
      showNotif(item.hasPrice ? '🔒 Item dikunci dengan harga' : '🔓 Item dibuka gratis');
      render();
    }
  }

              </div>
            </div>

    });

            deleteUpload(id, category);
          }
        }
      }
      
      if (target.classList.contains('btn-toggle-price')) {
        const id = target.getAttribute('data-id');
        const category = target.getAttribute('data-category');
        if (id && category) {
          togglePrice(id, category);
        }
      }
    });
  }

  function attachGlobalEvents() {
    document.querySelectorAll(".play-icon[data-play='true']").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        if(id) togglePlayer(id);
      });
    });

    document.querySelectorAll(".btn-play-now[data-play-now='true']").forEach(el => {
      el.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        if(id) {
          const player = document.querySelector(`.player-wrapper[data-song-id="${id}"]`);
          if(player) {
            player.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
          togglePlayer(id);
        }
      });
    });

    document.querySelectorAll(".btn-close-player[data-close-player='true']").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        const player = document.querySelector(`.player-wrapper[data-song-id="${id}"]`);
        if(player) {
          player.classList.remove('active');
          const iframe = player.querySelector('iframe');
          if(iframe) iframe.src = '';
        }
      });
    });

    document.querySelectorAll(".fav-icon:not([data-movie='true']):not([data-novel='true']):not([data-anime='true'])").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        if(id) toggleFavorite(id);
      });
    });

    document.querySelectorAll(".fav-icon[data-movie='true']").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        if(id) toggleMovieFavorite(id);
      });
    });

    document.querySelectorAll(".fav-icon[data-novel='true']").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        if(id) toggleNovelFavorite(id);
      });
    });

    document.querySelectorAll(".fav-icon[data-anime='true']").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        if(id) toggleAnimeFavorite(id);
      });
    });

    document.querySelectorAll(".journal-icon").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        if(id) openJournalModal(id);
      });
    });

    document.querySelectorAll(".watch-icon[data-watch='true']").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        const movie = allMovies.find(m => m.id === id);
        if(movie) {
          window.open(movie.youtube, '_blank');
          showNotif(`🎬 Membuka trailer: ${movie.title}`);
        }
      });
    });

    document.querySelectorAll(".btn-watch-now[data-watch-now='true']").forEach(el => {
      el.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        const movie = allMovies.find(m => m.id === id);
        if(movie) {
          window.open(movie.youtube, '_blank');
          showNotif(`🎬 Membuka trailer: ${movie.title}`);
        }
      });
    });

    document.querySelectorAll(".read-icon[data-read='true']").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        const novel = allNovels.find(n => n.id === id);
        if(novel) {
          window.open(novel.google, '_blank');
          showNotif(`📚 Membuka: ${novel.title}`);
        } else {
          const anime = allAnime.find(a => a.id === id);
          if(anime) {
            window.open(anime.google, '_blank');
            showNotif(`🎌 Membuka: ${anime.title}`);
          }
        }
      });
    });

    document.querySelectorAll(".btn-read-now[data-read-now='true']").forEach(el => {
      el.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        let item = allNovels.find(n => n.id === id);
        if(item) {
          window.open(item.google, '_blank');
          showNotif(`📚 Membuka: ${item.title}`);
        } else {
          item = allAnime.find(a => a.id === id);
          if(item) {
            window.open(item.google, '_blank');
            showNotif(`🎌 Membuka: ${item.title}`);
          }
        }
      });
    });
  }

  function attachBuyEvents() {
    document.querySelectorAll('.btn-buy-access[data-buy="true"]').forEach(el => {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        const id = this.getAttribute('data-id');
        const category = this.getAttribute('data-category');
        let item = null;
        
        if (category === 'music') item = allSongs.find(s => s.id === id);
        else if (category === 'movie') item = allMovies.find(m => m.id === id);
        else if (category === 'novel') item = allNovels.find(n => n.id === id);
        else if (category === 'anime') item = allAnime.find(a => a.id === id);
        
        if (item) {
          openPaymentModal(item);
        }
      });
    });
  }

  function attachDownloadEvents() {
    document.querySelectorAll('.btn-download-file').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const fileData = this.getAttribute('data-file');
        const fileName = this.getAttribute('data-name') || 'file';
        if (fileData) {
          downloadFile(fileData, fileName);
        }
      });
    });
  }

  function attachUserEvents() {
    const userBtn = document.getElementById('userMenuBtn');
    const dropdown = document.getElementById('userDropdown');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    
    if (userBtn && dropdown) {
      userBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
      });
      document.addEventListener('click', () => {
        if (dropdown) dropdown.style.display = 'none';
      });
    }
    
    if (loginBtn) {
      loginBtn.addEventListener('click', () => openAuthModal('login'));
    }
    
    if (logoutBtn) {
      logoutBtn.addEventListener('click', logoutUser);
    }
  }

  // ---------- INIT ----------
  document.getElementById('closeAuthBtn').addEventListener('click', closeAuthModal);
  document.getElementById('authModal').addEventListener('click', (e) => {
    if(e.target === e.currentTarget) closeAuthModal();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') {
      closeAuthModal();
      closePaymentModal();
    }
  });
  document.getElementById('authSubmitBtn').addEventListener('click', handleAuth);
  document.getElementById('authPassword').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') handleAuth();
  });
  document.getElementById('authEmail').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') handleAuth();
  });

  // Payment modal events
  document.getElementById('paymentCancelBtn').addEventListener('click', closePaymentModal);
  document.getElementById('paymentModal').addEventListener('click', (e) => {
    if(e.target === e.currentTarget) closePaymentModal();
  });
  document.getElementById('paymentConfirmBtn').addEventListener('click', confirmPayment);

  render();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch(err => console.error('SW gagal:', err));
  }
</script>
</body>
</html>
