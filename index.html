<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/IkonStarlume.png" />
  <title>Starlume · Premium Music Experience · Song Journal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%);
      color: #FFFFFF;
      padding-bottom: 2rem;
      min-height: 100vh;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      border-radius: 10px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    /* NAVBAR PREMIUM */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
      background: rgba(10, 10, 10, 0.7);
      backdrop-filter: blur(20px);
      padding: 0.8rem 2rem;
      border-radius: 100px;
      border: 1px solid rgba(255, 215, 0, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .logo {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .logo-icon {
      font-size: 2rem;
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
      animation: starPulse 2s ease-in-out infinite;
    }

    @keyframes starPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    .logo-text {
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #FFD700, #FFA500, #FFD700);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 3px;
    }

    .logo-badge {
      font-size: 0.7rem;
      background: rgba(255, 215, 0, 0.2);
      padding: 2px 8px;
      border-radius: 20px;
      color: #FFD700;
      margin-left: 8px;
    }

    .nav-links {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid rgba(255, 215, 0, 0.3);
      padding: 0.5rem 1.5rem;
      border-radius: 40px;
      color: #FFFFFF;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
    }

    .nav-btn.active, .nav-btn:hover {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #000000;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
      border-color: transparent;
      transform: translateY(-2px);
    }

    /* HERO */
    .hero {
      background: url('icons/20.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: 4rem 2rem;
      border-radius: 2rem;
      margin-bottom: 2.5rem;
      text-align: center;
      border: 1px solid rgba(255, 215, 0, 0.2);
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .hero h2, .hero p {
      position: relative;
      z-index: 1;
    }

    .hero h2 {
      font-size: 3.2rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #FFD700, #FFA500, #FFD700, #FFFFFF);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 800;
      letter-spacing: 4px;
      display: inline-block;
      animation: textShine 3s ease-in-out infinite;
    }

    @keyframes textShine {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.3); }
    }

    .hero p {
      color: #CCCCCC;
      font-size: 1.1rem;
      background: rgba(0, 0, 0, 0.5);
      display: inline-block;
      padding: 0.5rem 2rem;
      border-radius: 60px;
      backdrop-filter: blur(8px);
      margin-top: 0.5rem;
      border: 1px solid rgba(255, 215, 0, 0.2);
    }

    /* STATS BAR */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      padding: 0.8rem 1.8rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 215, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .stat-number {
      font-size: 1.6rem;
      font-weight: 800;
      color: #FFD700;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #AAAAAA;
    }

    .mood-section {
      margin-bottom: 2rem;
    }

    .section-title {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #FFFFFF, #FFD700);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 1px;
    }

    .mood-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .mood-btn {
      background: rgba(20, 20, 20, 0.8);
      backdrop-filter: blur(8px);
      padding: 0.9rem 2rem;
      border-radius: 60px;
      font-size: 1rem;
      font-weight: 600;
      border: 1px solid rgba(255, 215, 0, 0.2);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      color: #FFFFFF;
      position: relative;
      overflow: hidden;
    }

    .mood-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 215, 0, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .mood-btn:hover::before {
      width: 300px;
      height: 300px;
    }

    .mood-btn:hover, .mood-btn.active {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #000000;
      transform: translateY(-4px) scale(1.02);
      border-color: transparent;
      box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
    }

    .results-container {
      margin-top: 1rem;
      animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 2rem;
    }

    /* MUSIC CARD PREMIUM */
    .music-card {
      background: linear-gradient(135deg, rgba(20, 20, 20, 0.9), rgba(15, 15, 15, 0.95));
      backdrop-filter: blur(10px);
      border-radius: 1.5rem;
      overflow: hidden;
      border: 1px solid rgba(255, 215, 0, 0.1);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .music-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #FFD700, #FFA500, #FFD700);
      transform: scaleX(0);
      transition: transform 0.4s ease;
    }

    .music-card:hover::after {
      transform: scaleX(1);
    }

    .music-card:hover {
      transform: translateY(-10px);
      border-color: rgba(255, 215, 0, 0.4);
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5);
    }

    .card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .music-card:hover .card-img {
      transform: scale(1.05);
    }

    .card-body {
      padding: 1.3rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #FFFFFF;
      margin-bottom: 8px;
    }

    .artist-name {
      font-size: 0.85rem;
      color: #FFD700;
      margin-bottom: 8px;
    }

    .action-icons {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .fav-icon, .journal-icon {
      cursor: pointer;
      font-size: 1.4rem;
      transition: all 0.2s ease;
    }

    .fav-icon:hover, .journal-icon:hover {
      transform: scale(1.2);
    }

    .fav-icon.active {
      color: #FFD700;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.8);
      animation: starPop 0.3s ease;
    }

    .journal-icon {
      color: #BBBBFF;
    }

    .journal-icon.has-note {
      color: #FFD700;
      text-shadow: 0 0 6px gold;
    }

    @keyframes starPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    .music-quote {
      background: rgba(255, 215, 0, 0.05);
      padding: 0.8rem 1rem;
      border-radius: 14px;
      margin: 12px 0;
      font-size: 0.8rem;
      line-height: 1.5;
      color: #CCCCCC;
      border-left: 3px solid #FFD700;
      font-style: italic;
    }

    .track-links {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .track-links a {
      color: #FFFFFF;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      background: rgba(30, 30, 30, 0.9);
      padding: 8px 18px;
      border-radius: 40px;
      transition: all 0.25s ease;
      border: 1px solid rgba(255, 215, 0, 0.2);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      justify-content: center;
    }

    .track-links a:hover {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #000000;
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
    }

    .empty-fav, .empty-journal {
      text-align: center;
      padding: 4rem;
      background: linear-gradient(135deg, rgba(20, 20, 20, 0.5), rgba(10, 10, 10, 0.5));
      border-radius: 2rem;
      margin: 1rem 0;
      color: #AAAAAA;
      border: 1px dashed rgba(255, 215, 0, 0.3);
    }

    .toast-msg {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
      border-left: 4px solid #FFD700;
      padding: 0.8rem 1.8rem;
      border-radius: 50px;
      backdrop-filter: blur(20px);
      z-index: 1000;
      animation: slideInRight 0.3s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      color: white;
      font-weight: 500;
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(60px);}
      to { opacity: 1; transform: translateX(0);}
    }

    .back-btn {
      background: rgba(30,30,30,0.8);
      border: 1px solid rgba(255, 215, 0, 0.3);
      padding: 0.6rem 1.8rem;
      border-radius: 40px;
      color: #FFFFFF;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(4px);
    }

    .back-btn:hover {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #000000;
      transform: translateX(-5px);
      border-color: transparent;
    }

    /* MODAL JURNAL */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      z-index: 1100;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: linear-gradient(135deg, #1e1e2a, #12121a);
      border-radius: 2rem;
      max-width: 550px;
      width: 90%;
      padding: 2rem;
      border: 1px solid rgba(255,215,0,0.3);
      box-shadow: 0 30px 50px rgba(0,0,0,0.6);
      animation: fadeInUp 0.3s;
    }

    .modal-content h3 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #FFD700;
    }

    .modal-song {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(255,215,0,0.2);
      padding-bottom: 0.5rem;
    }

    .modal textarea {
      width: 100%;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,215,0,0.3);
      border-radius: 1rem;
      padding: 1rem;
      color: white;
      font-size: 0.95rem;
      resize: vertical;
      margin-bottom: 1.5rem;
      font-family: inherit;
    }

    .modal-buttons {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
    }

    .modal-buttons button {
      padding: 0.6rem 1.5rem;
      border-radius: 40px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-save {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #000;
    }

    .btn-delete {
      background: rgba(255,80,80,0.8);
      color: white;
    }

    .btn-cancel {
      background: rgba(100,100,100,0.6);
      color: white;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      padding-top: 1.5rem;
      opacity: 0.6;
      font-size: 0.8rem;
      color: #888888;
      border-top: 1px solid rgba(255, 215, 0, 0.1);
    }

    @media (max-width: 700px) {
      .container { padding: 1rem; }
      .hero h2 { font-size: 1.6rem; letter-spacing: 2px; }
      .hero { padding: 2rem 1rem; }
      .card-grid { grid-template-columns: 1fr; }
      .track-links a { padding: 6px 12px; font-size: 0.7rem; }
      .mood-btn { padding: 0.6rem 1.2rem; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

<div class="container" id="appRoot"></div>

<script>
  // ---------- DATA SONG SAMA SEPERTI SEBELUMNYA ----------
  const iconImages = [];
  for (let i = 1; i <= 60; i++) {
    if (i !== 20) iconImages.push(`icons/${i}.png`);
  }
  function getIconImage(index) { return iconImages[index % iconImages.length]; }

  const quotesByMood = {
    senang: ["✨ Kebahagiaan bukan tentang memiliki apa yang kita inginkan...", "🌞 Dunia ini indah jika kita melihatnya dengan mata penuh rasa syukur.", "💫 Hal-hal baik akan datang kepada mereka yang menunggu..."],
    sedih: ["💧 Sesuatu yang patah tidak selalu harus diperbaiki...", "🌧️ Air mata adalah cara hati berbicara...", "🌙 Hujan tak pernah memilih tempat jatuh..."],
    galau: ["💭 Terkadang kita terlalu sibuk memikirkan masa depan...", "🌀 Memahami perasaan sendiri adalah teka-teki paling sulit...", "💔 Hati ingin menetap, tapi logika menyuruh angkat kaki..."],
    romantis: ["❤️ Cinta tidak mencari orang yang sempurna...", "📖 Jika aku bisa menuliskan kisah kita...", "🏠 Rumah bukan hanya sekadar bangunan..."],
    marah: ["🔥 Amarah adalah api yang membakar pembawanya lebih dulu...", "⚠️ Jangan mengambil keputusan saat sedang marah...", "🤐 Diam adalah respons terbaik..."],
    fokus: ["🎯 Keberhasilan adalah jumlah upaya kecil konsisten...", "⏰ Jangan menunggu waktu tepat...", "🌉 Disiplin adalah jembatan tujuan..."],
    relax: ["🌊 Bernapaslah perlahan. Kamu tidak harus menyelesaikan dunia hari ini.", "🍃 Terkadang langkah paling produktif adalah beristirahat.", "💧 Biarkan semuanya mengalir seperti air..."]
  };
  for (let mood in quotesByMood) {
    while(quotesByMood[mood].length < 50) quotesByMood[mood] = [...quotesByMood[mood], ...quotesByMood[mood]].slice(0,50);
  }

  function generateSongsForMood(mood, moodName, startIndex) {
    const songTitlesByMood = {
      senang: ["Happy", "Can't Stop The Feeling", "Good as Hell", "On Top of The World", "Levitating", "Uptown Funk", "Shake It Off", "Roar", "Don't Stop Me Now", "Walking On Sunshine"],
      sedih: ["Someone Like You", "Fix You", "All I Want", "Let Her Go", "Hello", "When I Was Your Man", "Stay With Me", "Say Something", "The Scientist", "Hurt"],
      galau: ["Terlukis Indah", "Risalah Hati", "Pupus", "Separuh Aku", "Rindu", "Mengejar Matahari", "Bawalah Cintaku", "Aku Yang Tersakiti", "Hampa", "Aku Bukan Untukmu"],
      romantis: ["Perfect", "All of Me", "A Thousand Years", "Thinking Out Loud", "Just The Way You Are", "Marry Me", "Everything", "I'm Yours", "Lucky", "The Way You Look Tonight"],
      marah: ["In The End", "Break Stuff", "Killing In The Name", "Numb", "Crawling", "Faint", "Given Up", "One Step Closer", "Points of Authority", "Somewhere I Belong"],
      fokus: ["Deep Focus", "Synthwave Study", "Brain Power", "Lofi Study Beats", "Ambient Focus", "Classical Piano", "Mozart Effect", "Beethoven Symphony", "Bach Cello Suite", "Chopin Nocturne"],
      relax: ["Weightless", "Clair de Lune", "River Flows In You", "Gymnopedie No.1", "Air On G String", "Canon In D", "Nocturne Op.9", "Moonlight Sonata", "Fur Elise", "Ave Maria"]
    };
    const artistsByMood = {
      senang: ["Pharrell Williams", "Justin Timberlake", "Lizzo", "Imagine Dragons", "Dua Lipa", "Bruno Mars", "Taylor Swift", "Katy Perry", "Queen", "Katrina & The Waves"],
      sedih: ["Adele", "Coldplay", "Kodaline", "Passenger", "Adele", "Bruno Mars", "Sam Smith", "A Great Big World", "Coldplay", "Johnny Cash"],
      galau: ["Rizky Febian", "Dewa 19", "Dewa 19", "Noah", "Raisa", "Keisya Levronka", "Afgan", "Judika", "Rio Febrian", "Rossa"],
      romantis: ["Ed Sheeran", "John Legend", "Christina Perri", "Ed Sheeran", "Bruno Mars", "Bruno Mars", "Michael Buble", "Jason Mraz", "Jason Mraz", "Frank Sinatra"],
      marah: ["Linkin Park", "Limp Bizkit", "Rage Against The Machine", "Linkin Park", "Linkin Park", "Linkin Park", "Linkin Park", "Linkin Park", "Linkin Park", "Linkin Park"],
      fokus: ["Lofi Girl", "Astral Throb", "Marlo", "Study Beats", "Ambient Music", "Classical Piano", "Mozart", "Beethoven", "Bach", "Chopin"],
      relax: ["Marconi Union", "Debussy", "Yiruma", "Erik Satie", "Bach", "Pachelbel", "Chopin", "Beethoven", "Beethoven", "Schubert"]
    };
    let songs = [];
    for (let i = 0; i < 50; i++) {
      const titleList = songTitlesByMood[mood];
      const artistList = artistsByMood[mood];
      const quoteList = quotesByMood[mood];
      songs.push({
        id: `${mood}_${startIndex + i}`,
        title: titleList[i % titleList.length] + (i >= titleList.length ? ` ${Math.floor(i / titleList.length) + 1}` : ""),
        artist: artistList[i % artistList.length],
        mood: moodName,
        img: getIconImage(startIndex + i),
        youtube: `https://www.youtube.com/results?search_query=${encodeURIComponent(titleList[i % titleList.length] + " " + artistList[i % artistList.length])}`,
        spotify: `https://open.spotify.com/search/${encodeURIComponent(titleList[i % titleList.length] + " " + artistList[i % artistList.length])}`,
        quote: quoteList[i % quoteList.length]
      });
    }
    return songs;
  }

  const songsDatabase = {
    senang: generateSongsForMood("senang", "Senang", 0),
    sedih: generateSongsForMood("sedih", "Sedih", 50),
    galau: generateSongsForMood("galau", "Galau", 100),
    romantis: generateSongsForMood("romantis", "Romantis", 150),
    marah: generateSongsForMood("marah", "Marah", 200),
    fokus: generateSongsForMood("fokus", "Fokus", 250),
    relax: generateSongsForMood("relax", "Relax", 300)
  };

  let allSongs = Object.values(songsDatabase).flat();
  let currentPage = "home";
  let selectedMood = null;
  let favorites = JSON.parse(localStorage.getItem("starlume_fav")) || [];
  let songJournal = JSON.parse(localStorage.getItem("starlume_journal")) || {}; // { songId: "catatan..." }

  function saveFav() { localStorage.setItem("starlume_fav", JSON.stringify(favorites)); }
  function saveJournal() { localStorage.setItem("starlume_journal", JSON.stringify(songJournal)); }

  function showNotif(message) {
    let oldToast = document.querySelector(".toast-msg");
    if(oldToast) oldToast.remove();
    let toast = document.createElement("div");
    toast.className = "toast-msg";
    toast.innerText = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2800);
  }

  function toggleFavorite(songId) {
    const index = favorites.indexOf(songId);
    if(index === -1) { favorites.push(songId); showNotif("✨ Ditambahkan ke favorit! ✨"); }
    else { favorites.splice(index,1); showNotif("⭐ Dihapus dari favorit"); }
    saveFav();
    render();
  }

  function isFavorite(songId) { return favorites.includes(songId); }
  function getJournalNote(songId) { return songJournal[songId] || ""; }
  function hasJournal(songId) { return !!songJournal[songId]; }

  function openJournalModal(songId) {
    const song = allSongs.find(s => s.id === songId);
    if(!song) return;
    const modal = document.createElement("div");
    modal.className = "modal";
    modal.id = "journalModal";
    modal.innerHTML = `
      <div class="modal-content">
        <h3>📖 Song Journal</h3>
        <div class="modal-song">${song.title} — ${song.artist}</div>
        <textarea id="journalText" rows="5" placeholder="Tulis kenangan, perasaan, atau pesan pribadi untuk lagu ini..."></textarea>
        <div class="modal-buttons">
          <button class="btn-delete" id="deleteJournalBtn">🗑 Hapus</button>
          <button class="btn-cancel" id="cancelJournalBtn">Batal</button>
          <button class="btn-save" id="saveJournalBtn">💾 Simpan Catatan</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    const textarea = modal.querySelector("#journalText");
    textarea.value = songJournal[songId] || "";
    modal.style.display = "flex";
    
    const closeModal = () => modal.remove();
    modal.querySelector("#cancelJournalBtn").onclick = closeModal;
    modal.querySelector("#saveJournalBtn").onclick = () => {
      const newNote = textarea.value.trim();
      if(newNote === "") {
        if(songJournal[songId]) delete songJournal[songId];
        showNotif("📓 Catatan dihapus.");
      } else {
        songJournal[songId] = newNote;
        showNotif("📓 Catatan tersimpan! ✨");
      }
      saveJournal();
      closeModal();
      render();
    };
    modal.querySelector("#deleteJournalBtn").onclick = () => {
      if(songJournal[songId]) delete songJournal[songId];
      saveJournal();
      showNotif("🗑 Catatan jurnal dihapus.");
      closeModal();
      render();
    };
    modal.addEventListener("click", (e) => { if(e.target === modal) closeModal(); });
  }

  function renderRecommendations() {
    if (!selectedMood) return '';
    const songs = songsDatabase[selectedMood] || [];
    if (songs.length === 0) return '<div class="empty-fav">Tidak ada lagu untuk mood ini</div>';
    let html = `<div class="results-container"><div class="card-grid">`;
    songs.forEach(song => {
      const hasNote = hasJournal(song.id);
      html += `
        <div class="music-card">
          <img class="card-img" src="${song.img}" alt="${song.title}" loading="lazy" onerror="this.src='https://picsum.photos/id/100/400/250'">
          <div class="card-body">
            <div class="card-title">
              🎵 ${song.title}
              <div class="action-icons">
                <span class="journal-icon ${hasNote ? 'has-note' : ''}" data-id="${song.id}" data-journal="true">📖</span>
                <span class="fav-icon ${isFavorite(song.id) ? 'active' : ''}" data-id="${song.id}">${isFavorite(song.id) ? '★' : '☆'}</span>
              </div>
            </div>
            <div class="artist-name">${song.artist}</div>
            <div class="music-quote">“${song.quote}”</div>
            <div class="track-links">
              <a href="${song.youtube}" target="_blank">▶️ YouTube</a>
              <a href="${song.spotify}" target="_blank">🎧 Spotify</a>
            </div>
          </div>
        </div>
      `;
    });
    html += `</div></div>`;
    return html;
  }

  function renderJournalEntries() {
    const entries = Object.entries(songJournal);
    if(entries.length === 0) return `<div class="empty-journal">📭 Belum ada catatan jurnal. Klik ikon 📖 di lagu mana pun untuk mulai menulis kenanganmu.</div>`;
    let html = `<div class="card-grid">`;
    for(let [songId, note] of entries) {
      const song = allSongs.find(s => s.id === songId);
      if(!song) continue;
      html += `
        <div class="music-card">
          <img class="card-img" src="${song.img}" onerror="this.src='https://picsum.photos/id/100/400/250'">
          <div class="card-body">
            <div class="card-title">📔 ${song.title}</div>
            <div class="artist-name">${song.artist}</div>
            <div style="background:rgba(255,215,0,0.1); padding:0.8rem; border-radius:1rem; margin:10px 0; border-left:3px solid #FFD700;">
              <span style="color:#FFD700;">✍️ Catatan:</span><br>${note.replace(/\n/g, '<br>')}
            </div>
            <div class="track-links">
              <a href="${song.youtube}" target="_blank">▶️ YouTube</a>
              <a href="${song.spotify}" target="_blank">🎧 Spotify</a>
            </div>
            <div style="margin-top:12px; display:flex; gap:10px;">
              <button class="edit-journal-btn" data-id="${song.id}" style="background:#333; border:none; border-radius:30px; padding:6px 12px; color:white; cursor:pointer;">✏️ Edit Catatan</button>
            </div>
          </div>
        </div>
      `;
    }
    html += `</div>`;
    return html;
  }

  function render() {
    const app = document.getElementById("appRoot");
    if (currentPage === "home") {
      let html = `
        <div class="navbar">
          <div class="logo"><span class="logo-icon">✨</span><span class="logo-text">STARLUME</span><span class="logo-badge">PREMIUM</span></div>
          <div class="nav-links">
            <button class="nav-btn active" data-page="home">🏠 Beranda</button>
            <button class="nav-btn" data-page="favorites">⭐ Favorit (${favorites.length})</button>
            <button class="nav-btn" data-page="journal">📓 Song Journal (${Object.keys(songJournal).length})</button>
          </div>
        </div>
        <div class="hero"><h2>Pilih Mood, Rasakan Getaran</h2><p>${allSongs.length}+ lagu premium + Jurnal Kenangan Pribadi</p></div>
        <div class="stats-bar">
          <div class="stat-card"><span class="stat-number">${allSongs.length}</span><span class="stat-label">Total Lagu</span></div>
          <div class="stat-card"><span class="stat-number">7</span><span class="stat-label">Mood</span></div>
          <div class="stat-card"><span class="stat-number">${favorites.length}</span><span class="stat-label">Favorit</span></div>
          <div class="stat-card"><span class="stat-number">${Object.keys(songJournal).length}</span><span class="stat-label">Jurnal</span></div>
        </div>
        <div class="mood-section">
          <div class="section-title">🎭 Bagaimana perasaanmu sekarang?</div>
          <div class="mood-grid">
            ${["senang","sedih","galau","romantis","marah","fokus","relax"].map(m => `<button class="mood-btn ${selectedMood === m ? 'active' : ''}" data-mood="${m}">${m==='senang'?'😄':m==='sedih'?'😢':m==='galau'?'🌧️':m==='romantis'?'❤️':m==='marah'?'😠':m==='fokus'?'🎯':'🍃'} ${getMoodDisplayName(m)}</button>`).join('')}
          </div>
        </div>
        ${selectedMood ? renderRecommendations() : '<div style="text-align:center; padding:2.5rem; background: rgba(255,215,0,0.03); border-radius: 2rem;"><span style="font-size: 3rem;">✨</span><p style="margin-top: 1rem;">Klik salah satu mood di atas untuk memulai</p></div>'}
        <footer>© 2025 Starlume — Simpan kenangan lewat Song Journal 📖</footer>
      `;
      app.innerHTML = html;
      attachHomeEvents();
    }
    else if (currentPage === "favorites") {
      const favSongs = allSongs.filter(s => favorites.includes(s.id));
      let html = `
        <div class="navbar">
          <div class="logo"><span class="logo-icon">✨</span><span class="logo-text">STARLUME</span><span class="logo-badge">PREMIUM</span></div>
          <div class="nav-links">
            <button class="nav-btn" data-page="home">🏠 Beranda</button>
            <button class="nav-btn active" data-page="favorites">⭐ Favorit (${favSongs.length})</button>
            <button class="nav-btn" data-page="journal">📓 Song Journal (${Object.keys(songJournal).length})</button>
          </div>
        </div>
        <div class="hero" style="padding:2rem;"><h2 style="font-size:2rem;">⭐ Koleksi Favoritmu ⭐</h2><p>${favSongs.length} lagu tersimpan di hati</p></div>
        <button class="back-btn" id="backHomeBtn">← Kembali ke Beranda</button>
      `;
      if(favSongs.length===0) html+=`<div class="empty-fav">✨ Belum ada favorit. Pilih lagu dan klik bintang ✨</div>`;
      else {
        html+=`<div class="card-grid">`;
        favSongs.forEach(s=>{
          const hasNote = hasJournal(s.id);
          html+=`
            <div class="music-card">
              <img class="card-img" src="${s.img}" onerror="this.src='https://picsum.photos/id/100/400/250'">
              <div class="card-body">
                <div class="card-title">🎵 ${s.title}<div class="action-icons"><span class="journal-icon ${hasNote ? 'has-note' : ''}" data-id="${s.id}" data-journal="true">📖</span><span class="fav-icon active" data-id="${s.id}">★</span></div></div>
                <div class="artist-name">${s.artist}</div>
                <div class="music-quote">“${s.quote}”</div>
                <div class="track-links"><a href="${s.youtube}" target="_blank">▶️ YouTube</a><a href="${s.spotify}" target="_blank">🎧 Spotify</a></div>
                <div style="margin-top:8px;"><span style="font-size:0.75rem; cursor:pointer;" class="fav-icon active" data-id="${s.id}">★ Hapus dari favorit</span></div>
              </div>
            </div>
          `;
        });
        html+=`</div>`;
      }
      app.innerHTML = html;
      attachFavEvents();
    }
    else if (currentPage === "journal") {
      let html = `
        <div class="navbar">
          <div class="logo"><span class="logo-icon">✨</span><span class="logo-text">STARLUME</span><span class="logo-badge">PREMIUM</span></div>
          <div class="nav-links">
            <button class="nav-btn" data-page="home">🏠 Beranda</button>
            <button class="nav-btn" data-page="favorites">⭐ Favorit (${favorites.length})</button>
            <button class="nav-btn active" data-page="journal">📓 Song Journal (${Object.keys(songJournal).length})</button>
          </div>
        </div>
        <div class="hero" style="padding:2rem;"><h2 style="font-size:2rem;">📖 Song Journal</h2><p>Setiap lagu punya cerita — tulis kenanganmu</p></div>
        <button class="back-btn" id="backHomeFromJournalBtn">← Kembali ke Beranda</button>
        ${renderJournalEntries()}
        <footer>📔 Catatan pribadi tersimpan di browser Anda.</footer>
      `;
      app.innerHTML = html;
      attachJournalEvents();
    }
  }

  function getMoodDisplayName(moodKey) {
    const names = { senang:"Senang", sedih:"Sedih", galau:"Galau", romantis:"Romantis", marah:"Marah", fokus:"Fokus", relax:"Relax" };
    return names[moodKey];
  }

  function attachHomeEvents() {
    document.querySelectorAll(".mood-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        selectedMood = btn.getAttribute("data-mood");
        showNotif(`🎵 Mood "${getMoodDisplayName(selectedMood)}" terpilih!`);
        render();
      });
    });
    attachGlobalEvents();
  }

  function attachFavEvents() {
    attachGlobalEvents();
    const backHome = document.getElementById("backHomeBtn");
    if(backHome) backHome.addEventListener("click", () => { currentPage = "home"; render(); });
  }

  function attachJournalEvents() {
    document.querySelectorAll(".edit-journal-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const id = btn.getAttribute("data-id");
        if(id) openJournalModal(id);
      });
    });
    const backHome = document.getElementById("backHomeFromJournalBtn");
    if(backHome) backHome.addEventListener("click", () => { currentPage = "home"; render(); });
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const page = btn.getAttribute("data-page");
        if(page === "home") { currentPage = "home"; render(); }
        if(page === "favorites") { currentPage = "favorites"; render(); }
        if(page === "journal") { currentPage = "journal"; render(); }
      });
    });
  }

  function attachGlobalEvents() {
    document.querySelectorAll(".fav-icon").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        if(id) toggleFavorite(id);
      });
    });
    document.querySelectorAll(".journal-icon").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        if(id) openJournalModal(id);
      });
    });
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const page = btn.getAttribute("data-page");
        if(page === "home") { currentPage = "home"; render(); }
        if(page === "favorites") { currentPage = "favorites"; render(); }
        if(page === "journal") { currentPage = "journal"; render(); }
      });
    });
  }

  render();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch(err => console.error('SW gagal:', err));
  }
</script>
</body>
</html>
