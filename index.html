<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/IkonStarlume.png" />
  <title>Starlume · Premium Music, Movie, Novel & Anime Experience</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0a0a0f 0%, #14141e 40%, #0f0f1a 100%);
      color: #FFFFFF;
      padding-bottom: 2rem;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 20%, rgba(255, 215, 0, 0.03) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 80%, rgba(255, 215, 0, 0.02) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #14141e;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #FFD700, #F5A623);
      border-radius: 10px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem;
      position: relative;
      z-index: 1;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2.5rem;
      background: rgba(20, 20, 30, 0.6);
      backdrop-filter: blur(30px) saturate(1.2);
      -webkit-backdrop-filter: blur(30px) saturate(1.2);
      padding: 0.6rem 1.8rem;
      border-radius: 100px;
      border: 1px solid rgba(255, 215, 0, 0.08);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .logo {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .logo-icon {
      font-size: 1.8rem;
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.3));
      animation: starPulse 3s ease-in-out infinite;
    }

    @keyframes starPulse {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.1) rotate(5deg); opacity: 0.9; }
    }

    .logo-text {
      font-size: 1.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #FFD700, #F5A623, #FFD700);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 2px;
      text-shadow: 0 0 40px rgba(255, 215, 0, 0.1);
    }

    .logo-badge {
      font-size: 0.6rem;
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.05));
      padding: 3px 12px;
      border-radius: 20px;
      color: #FFD700;
      border: 1px solid rgba(255, 215, 0, 0.15);
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 0.5rem 1.4rem;
      border-radius: 40px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(4px);
    }

    .nav-btn.active, .nav-btn:hover {
      background: linear-gradient(135deg, #FFD700, #F5A623);
      color: #0a0a0f;
      box-shadow: 0 4px 25px rgba(255, 215, 0, 0.35);
      border-color: transparent;
      transform: translateY(-2px);
    }

    .nav-btn .badge-count {
      background: rgba(255, 215, 0, 0.2);
      padding: 0 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      color: #FFD700;
      margin-left: 4px;
    }

    .nav-btn.active .badge-count {
      background: rgba(0, 0, 0, 0.2);
      color: #0a0a0f;
    }

    .user-btn {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 215, 0, 0.05));
      border: 1px solid rgba(255, 215, 0, 0.15);
      padding: 0.4rem 1.2rem 0.4rem 0.8rem;
      border-radius: 40px;
      color: #FFD700;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(4px);
    }

    .user-btn:hover {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.25), rgba(255, 215, 0, 0.1));
      transform: scale(1.02);
    }

    .user-btn .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FFD700, #F5A623);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: #0a0a0f;
      font-weight: 700;
    }

    .user-btn .user-name {
      max-width: 80px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .login-btn {
      background: linear-gradient(135deg, #FFD700, #F5A623);
      border: none;
      padding: 0.5rem 1.6rem;
      border-radius: 40px;
      color: #0a0a0f;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .login-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 25px rgba(255, 215, 0, 0.35);
    }

    .hero {
      position: relative;
      background: url('icons/20.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: 4rem 2rem;
      border-radius: 2rem;
      margin-bottom: 2.5rem;
      text-align: center;
      overflow: hidden;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 215, 0, 0.08);
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      z-index: 0;
      transition: background 0.5s ease;
    }

    .hero:hover::before {
      background: rgba(0, 0, 0, 0.4);
    }

    .hero .star-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, rgba(255,215,0,0.3), transparent),
        radial-gradient(2px 2px at 40px 70px, rgba(255,215,0,0.2), transparent),
        radial-gradient(2px 2px at 50px 160px, rgba(255,215,0,0.4), transparent),
        radial-gradient(2px 2px at 90px 40px, rgba(255,215,0,0.2), transparent),
        radial-gradient(2px 2px at 130px 80px, rgba(255,215,0,0.3), transparent),
        radial-gradient(2px 2px at 160px 30px, rgba(255,215,0,0.2), transparent),
        radial-gradient(1px 1px at 200px 120px, rgba(255,215,0,0.4), transparent),
        radial-gradient(2px 2px at 250px 50px, rgba(255,215,0,0.2), transparent),
        radial-gradient(1px 1px at 300px 90px, rgba(255,215,0,0.3), transparent),
        radial-gradient(2px 2px at 350px 40px, rgba(255,215,0,0.2), transparent);
      background-size: 400px 200px;
      animation: starTwinkle 4s ease-in-out infinite alternate;
      z-index: 0;
      opacity: 0.6;
      pointer-events: none;
    }

    @keyframes starTwinkle {
      0% { opacity: 0.3; }
      100% { opacity: 0.8; }
    }

    .hero .music-particles {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .hero .music-particles span {
      position: absolute;
      font-size: 1.2rem;
      opacity: 0.15;
      animation: floatParticle 15s linear infinite;
      color: #FFD700;
    }

    .hero .music-particles span:nth-child(1) { left: 5%; animation-delay: 0s; font-size: 1.5rem; }
    .hero .music-particles span:nth-child(2) { left: 15%; animation-delay: 2s; font-size: 1rem; }
    .hero .music-particles span:nth-child(3) { left: 25%; animation-delay: 4s; font-size: 2rem; }
    .hero .music-particles span:nth-child(4) { left: 35%; animation-delay: 1s; font-size: 1.2rem; }
    .hero .music-particles span:nth-child(5) { left: 45%; animation-delay: 3s; font-size: 1.8rem; }
    .hero .music-particles span:nth-child(6) { left: 55%; animation-delay: 5s; font-size: 1rem; }
    .hero .music-particles span:nth-child(7) { left: 65%; animation-delay: 2s; font-size: 1.6rem; }
    .hero .music-particles span:nth-child(8) { left: 75%; animation-delay: 4s; font-size: 1.2rem; }
    .hero .music-particles span:nth-child(9) { left: 85%; animation-delay: 1s; font-size: 1.4rem; }
    .hero .music-particles span:nth-child(10) { left: 92%; animation-delay: 3s; font-size: 1rem; }

    @keyframes floatParticle {
      0% { transform: translateY(100%) rotate(0deg); opacity: 0; }
      10% { opacity: 0.15; }
      90% { opacity: 0.15; }
      100% { transform: translateY(-100%) rotate(720deg); opacity: 0; }
    }

    .hero .wave-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent, rgba(255,215,0,0.2), rgba(255,215,0,0.5), rgba(255,215,0,0.2), transparent);
      z-index: 1;
      animation: wavePulse 3s ease-in-out infinite;
    }

    @keyframes wavePulse {
      0%, 100% { transform: scaleX(0.8); opacity: 0.3; }
      50% { transform: scaleX(1); opacity: 0.8; }
    }

    .hero h2, .hero p, .hero .hero-emoji {
      position: relative;
      z-index: 1;
    }

    .hero h2 {
      font-size: 3.5rem;
      margin-bottom: 0.8rem;
      background: linear-gradient(135deg, #FFD700, #F5A623, #FFD700, #FFFFFF);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 900;
      letter-spacing: 2px;
      animation: textShine 4s ease-in-out infinite;
      text-shadow: 0 0 60px rgba(255, 215, 0, 0.1);
    }

    @keyframes textShine {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .hero p {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.1rem;
      background: rgba(0, 0, 0, 0.4);
      display: inline-block;
      padding: 0.5rem 2rem;
      border-radius: 60px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.1);
      font-weight: 400;
    }

    .hero .hero-emoji {
      font-size: 3rem;
      display: block;
      margin-bottom: 0.5rem;
      animation: floatEmoji 3s ease-in-out infinite;
      filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.2));
    }

    @keyframes floatEmoji {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-10px) scale(1.05); }
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 0.7rem 1.8rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 215, 0, 0.1);
      transform: translateY(-2px);
    }

    .stat-number {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #FFD700, #F5A623);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .stat-label {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
    }

    .stat-icon {
      font-size: 1.2rem;
    }

    .section-title {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #FFFFFF, #FFD700);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 0.5px;
    }

    .mood-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.8rem;
      margin-bottom: 2.5rem;
    }

    .mood-btn {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 0.8rem 1.8rem;
      border-radius: 60px;
      font-size: 0.95rem;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      color: rgba(255, 255, 255, 0.7);
      position: relative;
      overflow: hidden;
    }

    .mood-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 215, 0, 0.15);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .mood-btn:hover::before {
      width: 400px;
      height: 400px;
    }

    .mood-btn:hover, .mood-btn.active {
      background: linear-gradient(135deg, #FFD700, #F5A623);
      color: #0a0a0f;
      transform: translateY(-3px) scale(1.02);
      border-color: transparent;
      box-shadow: 0 8px 35px rgba(255, 215, 0, 0.3);
    }

    .mood-btn .mood-emoji {
      font-size: 1.2rem;
    }

    .tab-container {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 0.7rem 2rem;
      border-radius: 40px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.95rem;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #FFD700, #F5A623);
      color: #0a0a0f;
      border-color: transparent;
      box-shadow: 0 4px 25px rgba(255, 215, 0, 0.25);
    }

    .tab-btn:hover {
      transform: translateY(-2px);
    }

    .genre-filter {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .genre-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 0.5rem 1.5rem;
      border-radius: 40px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.85rem;
    }

    .genre-btn.active {
      background: rgba(255, 215, 0, 0.15);
      color: #FFD700;
      border-color: rgba(255, 215, 0, 0.2);
    }

    .genre-btn:hover {
      transform: translateY(-2px);
      color: white;
    }

    .results-container {
      margin-top: 1rem;
      animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    .music-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.01));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 1.5rem;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .music-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #FFD700, #F5A623, transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .music-card:hover::before {
      opacity: 1;
    }

    .music-card:hover {
      transform: translateY(-8px);
      border-color: rgba(255, 215, 0, 0.15);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 215, 0, 0.03);
    }

    .card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      background: linear-gradient(135deg, #1a1a2e, #16213e);
    }

    .music-card:hover .card-img {
      transform: scale(1.04);
    }

    .card-img-placeholder {
      width: 100%;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      font-size: 3rem;
      color: rgba(255, 215, 0, 0.3);
    }

    .card-body {
      padding: 1.3rem 1.5rem 1.5rem;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .card-title .title-icon {
      margin-right: 6px;
    }

    .artist-name {
      font-size: 0.8rem;
      color: rgba(255, 215, 0, 0.7);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .action-icons {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .fav-icon, .journal-icon, .play-icon, .watch-icon, .read-icon {
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.25s ease;
    }

    .fav-icon:hover, .journal-icon:hover, .play-icon:hover, .watch-icon:hover, .read-icon:hover {
      transform: scale(1.2);
    }

    .fav-icon.active {
      color: #FFD700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      animation: starPop 0.4s ease;
    }

    .play-icon {
      color: rgba(76, 175, 80, 0.8);
    }

    .play-icon:hover {
      color: #66bb6a;
      text-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
    }

    .watch-icon {
      color: rgba(255, 100, 100, 0.8);
    }

    .watch-icon:hover {
      color: #ff6b6b;
      text-shadow: 0 0 20px rgba(255, 100, 100, 0.3);
    }

    .read-icon {
      color: rgba(100, 200, 255, 0.8);
    }

    .read-icon:hover {
      color: #66d9ff;
      text-shadow: 0 0 20px rgba(100, 200, 255, 0.3);
    }

    .journal-icon {
      color: rgba(187, 187, 255, 0.6);
    }

    .journal-icon.has-note {
      color: #FFD700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    @keyframes starPop {
      0% { transform: scale(1); }
      30% { transform: scale(1.4); }
      100% { transform: scale(1); }
    }

    .music-quote {
      background: rgba(255, 215, 0, 0.04);
      padding: 0.7rem 1rem;
      border-radius: 12px;
      margin: 10px 0;
      font-size: 0.78rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.6);
      border-left: 2px solid rgba(255, 215, 0, 0.2);
      font-style: italic;
    }

    .track-links {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .track-links a {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.04);
      padding: 7px 16px;
      border-radius: 40px;
      transition: all 0.25s ease;
      border: 1px solid rgba(255, 255, 255, 0.04);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      justify-content: center;
    }

    .track-links a:hover {
      background: linear-gradient(135deg, #FFD700, #F5A623);
      color: #0a0a0f;
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(255, 215, 0, 0.25);
    }

    .btn-play-now {
      background: linear-gradient(135deg, rgba(76, 175, 80, 0.15), rgba(76, 175, 80, 0.05)) !important;

      <input type="email" id="authEmail" placeholder="email@contoh.com" />
    </div>
    <div class="form-group">
      <label>🔒 Password</label>
      <input type="password" id="authPassword" placeholder="Minimal 6 karakter" />
    </div>

      Belum punya akun? <span id="authSwitchLink">Daftar</span>

<script>
  // ---------- AUTH SYSTEM ----------
  let currentUser = JSON.parse(localStorage.getItem('starlume_user')) || null;
  let isLoginMode = true;

  function getUsers() {
    return JSON.parse(localStorage.getItem('starlume_users')) || {};
  }

  function saveUsers(users) {
    localStorage.setItem('starlume_users', JSON.stringify(users));
  }

  function saveUserSession(user) {
    currentUser = user;
    localStorage.setItem('starlume_user', JSON.stringify(user));
  }

  function logoutUser() {
    currentUser = null;
    localStorage.removeItem('starlume_user');
    render();
    showNotif('👋 Anda telah logout');
  }

  function openAuthModal(mode = 'login') {
    isLoginMode = mode === 'login';
    const modal = document.getElementById('authModal');
    const title = document.getElementById('authTitle');
    const subtitle = document.getElementById('authSubtitle');
    const emoji = document.getElementById('authEmoji');
    const submitBtn = document.getElementById('authSubmitBtn');
    const switchLink = document.getElementById('authSwitchLink');
    const errorEl = document.getElementById('authError');
    
    errorEl.classList.remove('show');
    
    if (isLoginMode) {
      title.textContent = 'Selamat Datang';
      subtitle.textContent = 'Masuk ke akun Starlume Anda';
      emoji.textContent = '✨';
      submitBtn.textContent = 'Masuk';
      switchLink.textContent = 'Daftar';
      document.getElementById('authSwitch').innerHTML = 'Belum punya akun? <span id="authSwitchLink">Daftar</span>';
      document.getElementById('authSwitchLink').addEventListener('click', () => openAuthModal('register'));
    } else {
      title.textContent = 'Buat Akun';
      subtitle.textContent = 'Bergabung dengan Starlume';
      emoji.textContent = '🌟';
      submitBtn.textContent = 'Daftar';
      switchLink.textContent = 'Masuk';
      document.getElementById('authSwitch').innerHTML = 'Sudah punya akun? <span id="authSwitchLink">Masuk</span>';
      document.getElementById('authSwitchLink').addEventListener('click', () => openAuthModal('login'));
    }
    
    document.getElementById('authEmail').value = '';
    document.getElementById('authPassword').value = '';
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeAuthModal() {
    document.getElementById('authModal').classList.remove('active');
    document.body.style.overflow = '';
  }

  function handleAuth() {
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value.trim();
    const errorEl = document.getElementById('authError');
    
    if (!email || !password) {
      errorEl.textContent = 'Email dan password harus diisi';
      errorEl.classList.add('show');
      return;
    }
    
    const users = getUsers();
    
    if (isLoginMode) {
      if (users[email] && users[email].password === password) {
        saveUserSession({ email: email, name: users[email].name || email.split('@')[0] });
        closeAuthModal();
        render();
        showNotif(`👋 Selamat datang kembali, ${users[email].name || email.split('@')[0]}!`);
      } else {
        errorEl.textContent = 'Email atau password salah';
        errorEl.classList.add('show');
      }
    } else {
      if (users[email]) {
        errorEl.textContent = 'Email sudah terdaftar';
        errorEl.classList.add('show');
        return;
      }
      if (password.length < 6) {
        errorEl.textContent = 'Password minimal 6 karakter';
        errorEl.classList.add('show');
        return;
      }
      
      const name = email.split('@')[0];
      users[email] = { password: password, name: name };
      saveUsers(users);
      saveUserSession({ email: email, name: name });
      closeAuthModal();
      render();
      showNotif(`🎉 Selamat bergabung, ${name}!`);
    }
  }

  function showNotif(message) {
    let oldToast = document.querySelector(".toast-msg");
    if(oldToast) oldToast.remove();
    let toast = document.createElement("div");
    toast.className = "toast-msg";
    toast.innerText = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2800);
  }

  function toggleFavorite(songId) {
    if (!currentUser) {

    const index = favorites.indexOf(songId);
    if(index === -1) { favorites.push(songId); showNotif("✨ Ditambahkan ke favorit!"); }
    else { favorites.splice(index,1); showNotif("⭐ Dihapus dari favorit"); }

  function isFavorite(songId) { return favorites.includes(songId); }
  function isMovieFavorite(movieId) { return movieFavorites.includes(movieId); }
  function isNovelFavorite(novelId) { return novelFavorites.includes(novelId); }
  function isAnimeFavorite(animeId) { return animeFavorites.includes(animeId); }
  function hasJournal(songId) { return !!songJournal[songId]; }

  function togglePlayer(songId) {
    const song = allSongs.find(s => s.id === songId);
    if(!song || !song.youtubeId) {
      showNotif('🎵 Video tidak tersedia untuk lagu ini');
      return;
    }

    document.querySelectorAll('.player-wrapper.active').forEach(el => {
      if(el.dataset.songId !== songId) {
        el.classList.remove('active');
        const iframe = el.querySelector('iframe');
        if(iframe) {
          iframe.src = iframe.src;
        }
      }
    });

    const player = document.querySelector(`.player-wrapper[data-song-id="${songId}"]`);
    if(player) {
      const isActive = player.classList.contains('active');
      const iframe = player.querySelector('iframe');
      
      if(isActive) {
        player.classList.remove('active');
        if(iframe) {
          iframe.src = `https://www.youtube.com/embed/${song.youtubeId}?enablejsapi=1&rel=0&modestbranding=1`;
        }
        showNotif('⏹️ Player ditutup');
      } else {
        player.classList.add('active');
        if(iframe) {
          iframe.src = `https://www.youtube.com/embed/${song.youtubeId}?autoplay=1&enablejsapi=1&rel=0&modestbranding=1`;
        }
        showNotif(`▶️ Memutar: ${song.title}`);
      }
    }
  }

  function openJournalModal(songId) {
    if (!currentUser) {
      showNotif('🔒 Login dulu untuk menulis jurnal!');
      openAuthModal('login');
      return;
    }
    const song = allSongs.find(s => s.id === songId);
    if(!song) return;
    const modal = document.createElement("div");
    modal.className = "modal";
    modal.id = "journalModal";
    modal.innerHTML = `
      <div class="modal-content">
        <h3>📖 Song Journal</h3>
        <div class="modal-song">${song.title} — ${song.artist}</div>
        <textarea id="journalText" rows="5" placeholder="Tulis kenangan, perasaan, atau pesan pribadi untuk lagu ini..."></textarea>
        <div class="modal-buttons">
          <button class="btn-delete" id="deleteJournalBtn">🗑 Hapus</button>
          <button class="btn-cancel" id="cancelJournalBtn">Batal</button>
          <button class="btn-save" id="saveJournalBtn">💾 Simpan</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    const textarea = modal.querySelector("#journalText");
    textarea.value = songJournal[songId] || "";
    modal.style.display = "flex";
    
    const closeModal = () => modal.remove();
    modal.querySelector("#cancelJournalBtn").onclick = closeModal;
    modal.querySelector("#saveJournalBtn").onclick = () => {
      const newNote = textarea.value.trim();
      if(newNote === "") {
        if(songJournal[songId]) delete songJournal[songId];
        showNotif("📓 Catatan dihapus.");
      } else {
        songJournal[songId] = newNote;
        showNotif("📓 Catatan tersimpan! ✨");
      }
      saveJournal();
      closeModal();
      render();
    };
    modal.querySelector("#deleteJournalBtn").onclick = () => {
      if(songJournal[songId]) delete songJournal[songId];
      saveJournal();
      showNotif("🗑 Catatan jurnal dihapus.");
      closeModal();
      render();
    };
    modal.addEventListener("click", (e) => { if(e.target === modal) closeModal(); });
  }

                <button class="genre-btn ${selectedGenre === 'Non-Fiksi' ? 'active' : ''}" data-genre="Non-Fiksi">📊 Non-Fiksi</button>
                <button class="genre-btn ${selectedGenre === 'Romantis' ? 'active' : ''}" data-genre="Romantis">❤️ Romantis</button>
                <button class="genre-btn ${selectedGenre === 'Inspiratif' ? 'active' : ''}" data-genre="Inspiratif">💡 Inspiratif</button>
                <button class="genre-btn ${selectedGenre === 'Self-Help' ? 'active' : ''}" data-genre="Self-Help">🧠 Self-Help</button>
              ` : `
                <button class="genre-btn ${selectedGenre === 'Action' ? 'active' : ''}" data-genre="Action">💥 Action</button>
                <button class="genre-btn ${selectedGenre === 'Adventure' ? 'active' : ''}" data-genre="Adventure">🗺️ Adventure</button>
                <button class="genre-btn ${selectedGenre === 'Comedy' ? 'active' : ''}" data-genre="Comedy">😂 Comedy</button>
                <button class="genre-btn ${selectedGenre === 'Fantasy' ? 'active' : ''}" data-genre="Fantasy">🐉 Fantasy</button>
                <button class="genre-btn ${selectedGenre === 'Romance' ? 'active' : ''}" data-genre="Romance">❤️ Romance</button>
                <button class="genre-btn ${selectedGenre === 'Sci-Fi' ? 'active' : ''}" data-genre="Sci-Fi">🚀 Sci-Fi</button>
                <button class="genre-btn ${selectedGenre === 'Sports' ? 'active' : ''}" data-genre="Sports">⚽ Sports</button>
              `}
            </div>
          ` : ''}
          ${activeTab === 'movies' ? renderMovies() : activeTab === 'novels' ? renderNovels() : renderAnime()}
        `}
        <footer>© 2025 Starlume — Musik, Film, Novel & Anime dalam satu tempat 📖</footer>
      `;
      app.innerHTML = html;
      attachHomeEvents();
    }
    else if (currentPage === "favorites") {
      const favSongs = allSongs.filter(s => favorites.includes(s.id));
      const favMovies = allMovies.filter(m => movieFavorites.includes(m.id));
      const favNovels = allNovels.filter(n => novelFavorites.includes(n.id));
      const favAnime = allAnime.filter(a => animeFavorites.includes(a.id));
      const totalFav = favSongs.length + favMovies.length + favNovels.length + favAnime.length;
      
      let html = `
        <div class="navbar">
          <div class="logo"><span class="logo-icon">✨</span><span class="logo-text">STARLUME</span><span class="logo-badge">Premium</span></div>
          <div class="nav-links">
            <button class="nav-btn" data-page="home">🏠 Beranda</button>
            <button class="nav-btn active" data-page="favorites">⭐ Favorit <span class="badge-count">${totalFav}</span></button>
            <button class="nav-btn" data-page="journal">📓 Journal <span class="badge-count">${Object.keys(songJournal).length}</span></button>
            ${currentUser ? `
              <button class="user-btn" id="userMenuBtn">
                <span class="user-avatar">${userName.charAt(0).toUpperCase()}</span>
                <span class="user-name">${userName}</span>
                <span style="font-size:0.6rem;">▼</span>
              </button>
              <div id="userDropdown" style="display:none; position:absolute; top:60px; right:20px; background:rgba(20,20,30,0.95); backdrop-filter:blur(20px); border-radius:16px; padding:0.5rem; border:1px solid rgba(255,215,0,0.1); min-width:160px; z-index:100;">
                <div style="padding:0.5rem 1rem; color:rgba(255,255,255,0.4); font-size:0.8rem; border-bottom:1px solid rgba(255,255,255,0.05);">${currentUser.email}</div>
                <button id="logoutBtn" style="width:100%; background:none; border:none; color:rgba(255,80,80,0.7); padding:0.6rem 1rem; text-align:left; cursor:pointer; font-size:0.85rem; border-radius:10px; transition:0.2s;">🚪 Logout</button>
              </div>
            ` : `
              <button class="login-btn" id="loginBtn">🔑 Login</button>
            `}
          </div>
        </div>
        <div class="hero" style="padding:2.5rem; min-height:200px;">
          <div class="star-overlay"></div>
          <div class="music-particles"><span>♪</span><span>♫</span><span>♪</span><span>♬</span><span>♪</span></div>
          <div class="wave-line"></div>
          <span class="hero-emoji">⭐</span>
          <h2 style="font-size:2.2rem;">Koleksi Favoritmu</h2>
          <p>${favSongs.length} lagu · ${favMovies.length} film · ${favNovels.length} novel · ${favAnime.length} anime</p>
        </div>
        <button class="back-btn" id="backHomeBtn">← Kembali ke Beranda</button>
      `;
      
      if(totalFav === 0) {
        html += `<div class="empty-fav"><span class="empty-icon">✨</span>Belum ada favorit. Pilih lagu, film, novel atau anime dan klik bintang</div>`;
      } else {
        if(favSongs.length > 0) {
          html += `<h3 style="margin:1.5rem 0 1rem; color:rgba(255,215,0,0.8);">🎵 Lagu Favorit (${favSongs.length})</h3><div class="card-grid">`;
          favSongs.forEach(s=>{
            const hasNote = hasJournal(s.id);
            const hasYoutube = s.youtubeId;
            html+=`
              <div class="music-card">
                <img class="card-img" src="${s.img}" onerror="this.parentElement.innerHTML='<div class=\\'card-img-placeholder\\'>🎵</div>'">
                <div class="card-body">
                  <div class="card-title"><span><span class="title-icon">🎵</span> ${s.title}</span><div class="action-icons">${hasYoutube ? `<span class="play-icon" data-id="${s.id}" data-play="true">▶️</span>` : ''}<span class="journal-icon ${hasNote ? 'has-note' : ''}" data-id="${s.id}" data-journal="true">📖</span><span class="fav-icon active" data-id="${s.id}">★</span></div></div>
                  <div class="artist-name">${s.artist}</div>
                  <div class="music-quote">“${s.quote}”</div>
                  <div class="track-links"><a href="${s.youtube}" target="_blank">▶️ YouTube</a><a href="${s.spotify}" target="_blank">🎧 Spotify</a>${hasYoutube ? `<a href="#" class="btn-play-now" data-id="${s.id}" data-play-now="true">🔊 Putar</a>` : ''}</div>
                  ${hasYoutube ? `
                    <div class="player-wrapper" data-song-id="${s.id}" id="player_${s.id}">
                      <iframe src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                      <div class="player-controls">
                        <span class="now-playing">🎵 <strong>${s.title}</strong> — ${s.artist}</span>
                        <button class="btn-close-player" data-id="${s.id}" data-close-player="true">✕</button>
                      </div>
                    </div>
                  ` : ''}
                  <div style="margin-top:10px;"><span style="font-size:0.7rem; cursor:pointer; color:rgba(255,255,255,0.3);" class="fav-icon active" data-id="${s.id}">★ Hapus dari favorit</span></div>
                </div>
              </div>
            `;
          });
          html+=`</div>`;
        }
        
        if(favMovies.length > 0) {
          html += `<h3 style="margin:2rem 0 1rem; color:rgba(255,215,0,0.8);">🎬 Film Favorit (${favMovies.length})</h3><div class="card-grid">`;
          favMovies.forEach(m=>{
            html+=`
              <div class="music-card">
                <img class="card-img" src="${m.img}" onerror="this.parentElement.innerHTML='<div class=\\'card-img-placeholder\\'>🎬</div>'">
                <div class="card-body">
                  <div class="card-title"><span><span class="title-icon">🎬</span> ${m.title}</span><div class="action-icons"><span class="fav-icon active" data-id="${m.id}" data-movie="true">★</span></div></div>
                  <div class="artist-name">${m.origin} · ${m.year} · ${m.genre} · ⭐ ${m.rating}</div>
                  <div style="font-size:0.75rem; color:rgba(255,255,255,0.4); margin:8px 0;">Sutradara: ${m.director}</div>
                  <div class="track-links"><a href="${m.imdb}" target="_blank">🎬 IMDb</a><a href="${m.youtube}" target="_blank">▶️ Trailer</a></div>
                  <div style="margin-top:10px;"><span style="font-size:0.7rem; cursor:pointer; color:rgba(255,255,255,0.3);" class="fav-icon active" data-id="${m.id}" data-movie="true">★ Hapus dari favorit</span></div>
                </div>
              </div>
            `;
          });
          html+=`</div>`;
        }
        
        if(favNovels.length > 0) {
          html += `<h3 style="margin:2rem 0 1rem; color:rgba(255,215,0,0.8);">📚 Novel Favorit (${favNovels.length})</h3><div class="card-grid">`;
          favNovels.forEach(n=>{
            html+=`
              <div class="music-card">
                <img class="card-img" src="${n.img}" onerror="this.parentElement.innerHTML='<div class=\\'card-img-placeholder\\'>📚</div>'">
                <div class="card-body">
                  <div class="card-title"><span><span class="title-icon">📚</span> ${n.title}</span><div class="action-icons"><span class="fav-icon active" data-id="${n.id}" data-novel="true">★</span></div></div>
                  <div class="artist-name">${n.author} · ${n.year} · ${n.genre}</div>
                  <div style="font-size:0.8rem; color:rgba(255,255,255,0.6); margin:8px 0;">${n.description}</div>
                  <div class="track-links"><a href="${n.goodreads}" target="_blank">📚 Goodreads</a><a href="${n.google}" target="_blank">🔍 Cari</a></div>
                  <div style="margin-top:10px;"><span style="font-size:0.7rem; cursor:pointer; color:rgba(255,255,255,0.3);" class="fav-icon active" data-id="${n.id}" data-novel="true">★ Hapus dari favorit</span></div>
                </div>
              </div>
            `;
          });
          html+=`</div>`;
        }
        
        if(favAnime.length > 0) {
          html += `<h3 style="margin:2rem 0 1rem; color:rgba(255,215,0,0.8);">🎌 Anime Favorit (${favAnime.length})</h3><div class="card-grid">`;
          favAnime.forEach(a=>{
            html+=`
              <div class="music-card">
                <img class="card-img" src="${a.img}" onerror="this.parentElement.innerHTML='<div class=\\'card-img-placeholder\\'>🎌</div>'">
                <div class="card-body">
                  <div class="card-title"><span><span class="title-icon">🎌</span> ${a.title}</span><div class="action-icons"><span class="fav-icon active" data-id="${a.id}" data-anime="true">★</span></div></div>
                  <div class="artist-name">${a.author} · ${a.year} · ${a.genre}</div>
                  <div style="font-size:0.8rem; color:rgba(255,255,255,0.6); margin:8px 0;">${a.description}</div>
                  <div class="track-links"><a href="${a.myanimelist}" target="_blank">🎌 MyAnimeList</a><a href="${a.google}" target="_blank">🔍 Cari</a></div>
                  <div style="margin-top:10px;"><span style="font-size:0.7rem; cursor:pointer; color:rgba(255,255,255,0.3);" class="fav-icon active" data-id="${a.id}" data-anime="true">★ Hapus dari favorit</span></div>
                </div>
              </div>
            `;
          });
          html+=`</div>`;
        }
      }
      app.innerHTML = html;
      attachFavEvents();
    }
    else if (currentPage === "journal") {
      let html = `
        <div class="navbar">
          <div class="logo"><span class="logo-icon">✨</span><span class="logo-text">STARLUME</span><span class="logo-badge">Premium</span></div>
          <div class="nav-links">
            <button class="nav-btn" data-page="home">🏠 Beranda</button>
            <button class="nav-btn" data-page="favorites">⭐ Favorit <span class="badge-count">${favorites.length + movieFavorites.length + novelFavorites.length + animeFavorites.length}</span></button>
            <button class="nav-btn active" data-page="journal">📓 Journal <span class="badge-count">${Object.keys(songJournal).length}</span></button>
            ${currentUser ? `
              <button class="user-btn" id="userMenuBtn">
                <span class="user-avatar">${userName.charAt(0).toUpperCase()}</span>
                <span class="user-name">${userName}</span>
                <span style="font-size:0.6rem;">▼</span>
              </button>
              <div id="userDropdown" style="display:none; position:absolute; top:60px; right:20px; background:rgba(20,20,30,0.95); backdrop-filter:blur(20px); border-radius:16px; padding:0.5rem; border:1px solid rgba(255,215,0,0.1); min-width:160px; z-index:100;">
                <div style="padding:0.5rem 1rem; color:rgba(255,255,255,0.4); font-size:0.8rem; border-bottom:1px solid rgba(255,255,255,0.05);">${currentUser.email}</div>
                <button id="logoutBtn" style="width:100%; background:none; border:none; color:rgba(255,80,80,0.7); padding:0.6rem 1rem; text-align:left; cursor:pointer; font-size:0.85rem; border-radius:10px; transition:0.2s;">🚪 Logout</button>
              </div>
            ` : `
              <button class="login-btn" id="loginBtn">🔑 Login</button>
            `}
          </div>
        </div>
        <div class="hero" style="padding:2.5rem; min-height:200px;">
          <div class="star-overlay"></div>
          <div class="music-particles"><span>♪</span><span>♫</span><span>♪</span><span>♬</span><span>♪</span></div>
          <div class="wave-line"></div>
          <span class="hero-emoji">📖</span>
          <h2 style="font-size:2.2rem;">Song Journal</h2>
          <p>Setiap lagu punya cerita — tulis kenanganmu</p>
        </div>
        <button class="back-btn" id="backHomeFromJournalBtn">← Kembali ke Beranda</button>
        ${renderJournalEntries()}
        <footer>📔 Catatan pribadi tersimpan di browser Anda.</footer>
      `;
      app.innerHTML = html;
      attachJournalEvents();
    }
    
    attachUserEvents();
  }

  function attachUserEvents() {
    const userBtn = document.getElementById('userMenuBtn');
    const dropdown = document.getElementById('userDropdown');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    
    if (userBtn && dropdown) {
      userBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
      });
      document.addEventListener('click', () => {
        if (dropdown) dropdown.style.display = 'none';
      });
    }
    
    if (loginBtn) {
      loginBtn.addEventListener('click', () => openAuthModal('login'));
    }
    
    if (logoutBtn) {
      logoutBtn.addEventListener('click', logoutUser);
    }
  }

  function getMoodDisplayName(moodKey) {
    const names = { senang:"Senang", sedih:"Sedih", galau:"Galau", romantis:"Romantis", marah:"Marah", fokus:"Fokus", relax:"Relax" };
    return names[moodKey];
  }

  function attachHomeEvents() {
    // Tab buttons
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const tab = btn.getAttribute("data-tab");
        activeTab = tab;
        selectedGenre = 'Semua';
        render();
      });
    });

    // Genre filter buttons
    document.querySelectorAll(".genre-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const genre = btn.getAttribute("data-genre");
        selectedGenre = genre;
        render();
      });
    });

    document.querySelectorAll(".mood-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        selectedMood = btn.getAttribute("data-mood");
        showNotif(`🎵 Mood "${getMoodDisplayName(selectedMood)}" terpilih!`);
        render();
      });
    });
    attachGlobalEvents();
  }

  function attachFavEvents() {
    attachGlobalEvents();
    const backHome = document.getElementById("backHomeBtn");
    if(backHome) backHome.addEventListener("click", () => { currentPage = "home"; render(); });
  }

  function attachJournalEvents() {
    document.querySelectorAll(".edit-journal-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const id = btn.getAttribute("data-id");
        if(id) openJournalModal(id);
      });
    });
    const backHome = document.getElementById("backHomeFromJournalBtn");
    if(backHome) backHome.addEventListener("click", () => { currentPage = "home"; render(); });
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const page = btn.getAttribute("data-page");
        if(page === "home") { currentPage = "home"; render(); }
        if(page === "favorites") { currentPage = "favorites"; render(); }
        if(page === "journal") { currentPage = "journal"; render(); }
      });
    });
  }

  function attachGlobalEvents() {
    document.querySelectorAll(".play-icon[data-play='true']").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        if(id) togglePlayer(id);
      });
    });

    document.querySelectorAll(".btn-play-now[data-play-now='true']").forEach(el => {
      el.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        if(id) {
          const player = document.querySelector(`.player-wrapper[data-song-id="${id}"]`);
          if(player) {
            player.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
          togglePlayer(id);
        }
      });
    });

    document.querySelectorAll(".btn-close-player[data-close-player='true']").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        const player = document.querySelector(`.player-wrapper[data-song-id="${id}"]`);
        if(player) {
          player.classList.remove('active');
          const iframe = player.querySelector('iframe');
          if(iframe) iframe.src = '';
        }
      });
    });

    // Favorite untuk lagu
    document.querySelectorAll(".fav-icon:not([data-movie='true']):not([data-novel='true']):not([data-anime='true'])").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        if(id) toggleFavorite(id);
      });
    });

    // Favorite untuk film
    document.querySelectorAll(".fav-icon[data-movie='true']").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        if(id) toggleMovieFavorite(id);
      });
    });

    // Favorite untuk novel
    document.querySelectorAll(".fav-icon[data-novel='true']").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        if(id) toggleNovelFavorite(id);
      });
    });

    // Favorite untuk anime
    document.querySelectorAll(".fav-icon[data-anime='true']").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        if(id) toggleAnimeFavorite(id);
      });
    });

    document.querySelectorAll(".journal-icon").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        if(id) openJournalModal(id);
      });
    });

    // Watch movie
    document.querySelectorAll(".watch-icon[data-watch='true']").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        const movie = allMovies.find(m => m.id === id);
        if(movie) {
          window.open(movie.youtube, '_blank');
          showNotif(`🎬 Membuka trailer: ${movie.title}`);
        }
      });
    });

    document.querySelectorAll(".btn-watch-now[data-watch-now='true']").forEach(el => {
      el.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        const movie = allMovies.find(m => m.id === id);
        if(movie) {
          window.open(movie.youtube, '_blank');
          showNotif(`🎬 Membuka trailer: ${movie.title}`);
        }
      });
    });

    // Read novel
    document.querySelectorAll(".read-icon[data-read='true']").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        const novel = allNovels.find(n => n.id === id);
        if(novel) {
          window.open(novel.google, '_blank');
          showNotif(`📚 Membuka: ${novel.title}`);
        }
      });
    });

    document.querySelectorAll(".btn-read-now[data-read-now='true']").forEach(el => {
      el.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const id = el.getAttribute("data-id");
        let item = allNovels.find(n => n.id === id);
        if(item) {
          window.open(item.google, '_blank');
          showNotif(`📚 Membuka: ${item.title}`);
        } else {
          item = allAnime.find(a => a.id === id);
          if(item) {
            window.open(item.google, '_blank');
            showNotif(`🎌 Membuka: ${item.title}`);
          }
        }
      });
    });

    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const page = btn.getAttribute("data-page");
        if(page === "home") { currentPage = "home"; render(); }
        if(page === "favorites") { currentPage = "favorites"; render(); }
        if(page === "journal") { currentPage = "journal"; render(); }
      });
    });
  }

  document.getElementById('closeAuthBtn').addEventListener('click', closeAuthModal);
  document.getElementById('authModal').addEventListener('click', (e) => {
    if(e.target === e.currentTarget) closeAuthModal();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeAuthModal();
  });
  document.getElementById('authSubmitBtn').addEventListener('click', handleAuth);
  document.getElementById('authPassword').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') handleAuth();
  });
  document.getElementById('authEmail').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') handleAuth();
  });

  render();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js').catch(err => console.error('SW gagal:', err));
  }
</script>
</body>
</html>
